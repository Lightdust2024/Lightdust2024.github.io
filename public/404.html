        const preloaded = new Set();

        function preloadImage(src) {
            if (preloaded.has(src)) return;
            preloaded.add(src);
            const link = document.createElement('link');
            link.rel = 'preload';
            link.as = 'image';

                transform: 'translateZ(0)',
                backfaceVisibility: 'hidden'
            });

            bgContainer.appendChild(lightLayer);

            document.body.prepend(bgContainer);

            function updateBackground(scheme) {
                requestAnimationFrame(() => {
                    if (scheme === 'dark') {

        }

<script>
    function initTocHide() {
        
        let toc = document.querySelector(".widget--toc");
        if (!toc) {
            return;
        }
        
        window.addEventListener('scroll', function() {
            
            let openUl = document.querySelectorAll(".open");
            if (openUl.length > 0) {
              openUl.forEach((ul) => {
                ul.classList.remove("open")
              })
            }
            
            let currentLi = document.querySelector(".active-class");
            if (!currentLi) {
                return
            }
            
            if (currentLi.children.length > 1) {
                currentLi.children[1].classList.add("open")
            }
            
            let ul = currentLi.parentElement;
            do {
                ul.classList.add("open");
                ul = ul.parentElement.parentElement
            } while (ul !== undefined && (ul.localName === 'ul' || ul.localName === 'ol'))
        });
    }
    initTocHide()
</script>

<script>
  
  
  (function () {
    var toggle = document.getElementById('dark-mode-toggle');
    var label = toggle && toggle.querySelector('span');
    if (!label) {
      return;
    }
    
    
    var darkLabel = '暗色模式';
    var lightLabel = '亮色模式';
    var updateLabel = function (scheme) {
      label.textContent = scheme === 'dark' ? lightLabel : darkLabel;
    };
    
    window.addEventListener('onColorSchemeChange', function (e) {
      updateLabel(e.detail);
    });
    
    updateLabel(document.documentElement.getAttribute('data-scheme'));
  })();
</script>


<script>
  function initCodeMoreBox() {
    let codeBlocks = document.querySelectorAll(".highlight");
    if (!codeBlocks) {
      return;
    }
    codeBlocks.forEach(codeBlock => {
      
      if (codeBlock.scrollHeight <= codeBlock.clientHeight) {
        return;
      }
      
      
      let codeMoreBox = document.createElement('div');
      codeMoreBox.classList.add('code-more-box');
      
      let codeMoreBtn = document.createElement('span');
      codeMoreBtn.classList.add('code-more-btn');
      codeMoreBtn.addEventListener('click', () => {
        
        codeBlock.classList.toggle('code-show');
        
        window.dispatchEvent(new Event('resize'))
      })
      
      let img = document.createElement('img');
      img.classList.add('code-more-img');
      img.src = "http://localhost:1313/icons/codeMore.png"
      
      codeMoreBtn.appendChild(img);
      codeMoreBox.appendChild(codeMoreBtn);
      codeBlock.appendChild(codeMoreBox)
    })
  }

  initCodeMoreBox();
</script>
